name: validate

on:
  pull_request:
  push:
    branches-ignore: [feeds]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - name: Validate indicators
        env:
          NEVER_BLOCK_PRIVATE: ${{ secrets.NEVER_BLOCK_PRIVATE }}
        run: python3 scripts/feeds.py check --require-private
      - name: Self-test
        run: python3 scripts/test_feeds.py
